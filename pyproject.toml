[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world"
version = "0.1.0"
description = "A deterministic tick-based world for studying emergent LLM agent societies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agent World" }]
dependencies = []

[project.scripts]
agent-world = "agent_world.cli:main"

[tool.setuptools.packages.find]
include = ["agent_world*"]

[tool.setuptools.package-data]
agent_world = ["static/*.html", "static/*.css", "static/*.js", "static/*.woff2", "static/*-OFL.txt", "recipes/*.json"]
