name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard behavior
        run: |
          node tests/test_leaderboard_activity.cjs
          node tests/test_leaderboard_picker.cjs
      - name: Verify committed database
        run: python -m agent_world.benchmark_db verify
      - name: Smoke test installed wheel outside checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke-installed.py"
